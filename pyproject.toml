[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcrb"
version = "0.1.0"
description = "国产多模态大模型影视角色识别 Benchmark（Video Character Recognition Benchmark）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
# 标注页面
ui = ["streamlit>=1.35", "streamlit-drawable-canvas>=0.9,<0.10"]
# 本地视频抽帧（自带 ffmpeg 二进制）
video = ["imageio-ffmpeg>=0.4.9"]
# 统计精确检验（缺失时自动降级为正态近似并标注）
stats = ["scipy>=1.11"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "streamlit>=1.35",
    "streamlit-drawable-canvas>=0.9,<0.10",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
vcrb = "vcrb.cli:app"

[tool.setuptools.packages.find]
include = ["vcrb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
