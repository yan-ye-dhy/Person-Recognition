    official_series: "官方免费模型：擅长复杂场景理解与多步骤分析（视觉推理）"
    tier: flash
    supports_vision: doc
    enabled: false
    notes: "可选：thinking 型视觉推理对照。"
    params: {}

  - id: glm-4v-flash
    provider: zhipu
    vendor: GLM
    display_name: GLM-4V-Flash（免费）
    official_series: "官方免费模型：图像理解，16K 上下文/最大输出 1K"
    tier: flash
    supports_vision: doc
