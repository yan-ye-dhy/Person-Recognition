  - id: glm-5.3
    provider: zhipu
    vendor: GLM
    display_name: GLM-5.3（文本）
    official_series: "旗舰文本模型（模型概览『文本模型』分类）"
    tier: text
    supports_vision: none
    enabled: false
    notes: "纯文本模型，仅登记说明，不参与视觉评测。"
    params: {}

  - id: glm-4.6
    provider: zhipu
    vendor: GLM
    display_name: GLM-4.6（文本）
    official_series: "文本模型（模型概览『文本模型』分类）"
    tier: text
    supports_vision: none
    enabled: false
    notes: "纯文本模型，仅登记说明，不参与视觉评测。"
    params: {}

  # ------------------------- Qwen / 阿里云百炼 -------------------------
